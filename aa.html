<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chizzy's Custard - Order Now</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <div class="form-header">
            <h1>CHIZZY'S CUSTARD</h1>
            <h2>Place Your Order</h2>
            <p>Where every spoon feels like home ❤️</p>
        </div>

        <form>

            <div class="form-row">

                <div class="input-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" placeholder="Enter your first name" required>
                </div>

                <div class="input-group">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" placeholder="Enter your last name" required>
                </div>

            </div>


            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
            </div>


            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required>
            </div>


            <div class="input-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" placeholder="Enter your delivery address" required>
            </div>


            <div class="input-group">
                <label for="flavours">Select Flavour</label>

                <select id="flavours" name="flavours">
                    <option value="">-- Choose a flavour --</option>
                    <option value="Vanilla">Vanilla</option>
                    <option value="Chocolate">Chocolate</option>
                    <option value="3 in 1">3 in 1</option>
                    <option value="Strawberry">Strawberry</option>
                </select>
            </div>


            <div class="input-group">
                <label>Package Type</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="package" value="sachet">
                        Sachet
                    </label>

                    <label>
                        <input type="radio" name="package" value="container">
                        Container
                    </label>
                </div>
            </div>


            <div class="input-group">
                <label for="quantity">Select Product & Quantity</label>

                <select id="quantity" name="quantity">
                    <option value="">-- Select a product --</option>
                    <option>450g Chocolate Container</option>
                    <option>450g Vanilla Container</option>
                    <option>450g 3 in 1 Container</option>
                    <option>450g Strawberry Container</option>
                    <option>50g Chocolate Sachet</option>
                    <option>50g Vanilla Sachet</option>
                    <option>50g 3 in 1 Sachet</option>
                    <option>50g Strawberry Sachet</option>
                </select>
            </div>


            <div class="input-group">
                <label for="feedback">Your Feedback</label>

                <textarea id="feedback" name="feedback" rows="5"
                    maxlength="100"
                    placeholder="Enter your message or special request..."></textarea>

                <small>Maximum 100 characters</small>
            </div>


            <button type="submit" onclick="alert('Thank You for ordering')">
                ORDER NOW
            </button>

        </form>

        <footer>
            <p>&copy; 2026 CHIZZY'S CUSTARD. All Rights Reserved.</p>
        </footer>

    </div>

</body>
</html>
